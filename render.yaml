# Backend services; deploy the frontend separately on Vercel.
services:
  - type: web
    name: hacktober-aot-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd skippy_paradox/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: SKIPPY_ACCESS_TOKEN
        sync: false
      - key: SKIPPY_ALLOW_SHELL
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
  - type: web
    name: hacktober-aot-collab
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./deployment/socket.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SKIPPY_ACCESS_TOKEN
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
